<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b48"><title>7028 Manufacturing</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="app-header"><a class="brand" href="#parts" id="home"><span class="team-number">7028</span><span>Manufacturing</span></a><nav aria-label="Main navigation"><button data-view="parts" class="active">Parts</button><button data-view="board">Production</button><button data-view="inventory">Materials</button></nav><div class="header-actions"><button class="secondary" id="enter-shop">Shop mode</button><details class="tools-menu"><summary>More <span aria-hidden="true">⌄</span></summary><div class="tools-list"><button id="open-onshape">Onshape import</button><button id="export">Export CSV</button><button id="backup">Download backup</button><button id="restore">Restore backup</button><button id="clear-workspace" hidden>Clear workspace</button></div></details></div></header>
<section class="shop-controls" aria-label="Shop display controls" hidden><div class="shop-brand"><span class="team-number">7028</span><span>Shop</span></div><div class="shop-buttons"><button class="secondary" data-shop-view="board">Production</button><button class="secondary" data-shop-view="inventory">Materials</button><button class="secondary" id="shop-fullscreen">Fullscreen</button><button class="secondary" id="shop-awake" aria-pressed="false">Keep awake</button><button class="secondary" id="exit-shop">Exit</button></div><time id="shop-clock"></time></section>
<main><section class="page-heading"><div class="page-title-row"><h1 id="page-title">Parts</h1><span id="record-count" class="count"></span><span id="sample-label" class="sample-label" hidden>Sample data</span></div><button class="primary" id="add-record">Add part</button></section><div id="board-summary" class="board-summary" hidden></div>
<section class="content-panel" aria-label="Workspace records"><div class="toolbar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search parts" aria-label="Search records"></label><div class="filters"><select id="status-filter" aria-label="Filter by stage"><option value="">All stages</option></select><select id="tag-filter" aria-label="Filter blocked tags"><option value="">All parts</option><option value="blocked">Blocked</option><option value="clear">Not blocked</option></select><select id="subsystem-filter" aria-label="Filter by subsystem"><option value="">All subsystems</option></select></div></div><div id="records"></div></section>
<footer class="page-footer"><span id="result-count"></span><span><span class="local-note">Stored on this device</span><span id="save-status"></span></span></footer></main>
<dialog id="record-dialog" aria-labelledby="dialog-title"><form id="record-form"><div class="dialog-heading"><h2 id="dialog-title">Add part</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Close dialog">×</button></div><div id="form-fields" class="form-grid"></div><div class="dialog-actions"><button type="button" id="delete-record" class="danger">Delete part</button><div><button type="button" id="cancel-dialog" class="secondary">Cancel</button><button class="primary" type="submit">Save</button></div></div></form></dialog>
<dialog id="start-dialog" aria-labelledby="start-title"><form id="start-form"><div class="dialog-heading"><h2 id="start-title">Who’s working?</h2><button type="button" class="icon-button" id="close-start" aria-label="Cancel starting work">×</button></div><p id="start-part-name"></p><div id="worker-choices" class="worker-choices" aria-label="Choose a worker"></div><label class="worker-name-label" for="worker-name">Your name</label><input id="worker-name" name="worker" autocomplete="off" maxlength="100" required placeholder="Enter your name"><div class="dialog-actions"><div><button type="button" id="cancel-start" class="secondary">Cancel</button><button class="primary" type="submit">Start work</button></div></div></form></dialog>
<dialog id="onshape-dialog" aria-labelledby="onshape-title"><div class="dialog-heading"><h2 id="onshape-title">Onshape import</h2><button type="button" class="icon-button" id="close-onshape" aria-label="Close Onshape import">×</button></div><span id="onshape-connection" class="status">Checking connection</span><p class="import-rule">Read-only BOM · Part numbers starting with <strong>7028</strong></p><p id="onshape-message" role="status"></p><p class="import-help">Quantities come from the BOM. Workers and shop progress are preserved.</p><label class="onshape-auto"><input type="checkbox" id="onshape-auto" disabled> Auto-import every 5 minutes while open</label><p id="onshape-last-sync"></p><div id="onshape-results"></div><div class="dialog-actions"><div><button class="secondary" id="onshape-scan" disabled>Find parts</button><button class="primary" id="onshape-import" hidden>Import parts</button></div></div></dialog>
<input type="file" id="import-file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script>
</body></html>
